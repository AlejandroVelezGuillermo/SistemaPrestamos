<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sistema de Préstamos</title>

    <link
        rel="stylesheet"
        href="css/login.css"
    >
</head>

<body>

    <main class="login-container">

        <section class="login-card">

            <div class="login-header">

                <div class="logo">
                    $
                </div>

                <h1>Sistema de Préstamos</h1>

                <p>
                    Ingresa a tu cuenta para continuar
                </p>

            </div>


            <form id="loginForm">

                <div class="form-group">

                    <label for="correo">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        placeholder="correo@ejemplo.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Contraseña
                    </label>

                    <div class="password-container">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Ingresa tu contraseña"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="mostrarPassword"
                            class="password-button"
                            aria-label="Mostrar contraseña"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <div
                    id="mensaje"
                    class="mensaje"
                ></div>


                <button
                    type="submit"
                    id="loginButton"
                    class="login-button"
                >
                    Iniciar sesión
                </button>

            </form>


            <div class="login-footer">

                <p>
                    Sistema de gestión de préstamos
                </p>

            </div>

        </section>

    </main>


    <script src="js/login.js"></script>

</body>

</html>
